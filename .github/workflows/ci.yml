name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Unit tests (ChatClient and VectorStore mocked). The Testcontainers test RagApiIT is skipped
      # here because it needs ~2.3 GB of Ollama models; run it locally with `mvnw verify`.
      - name: Build and run unit tests
        run: mvn -B verify -DskipITs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
